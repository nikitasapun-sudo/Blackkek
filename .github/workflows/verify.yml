name: Verify educational finite-shoe model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check omega_v34_core.js
          node --check sw.js
          node --check tests/v34.cjs
          node --check tests/depleted_oracle.cjs
          node --check tests/integrity.cjs
          node --check tests/pwa_offline.cjs
          node --check tests/worker_watchdog.cjs
          node --check tests/performance.cjs
          node --check tests/offline_actions.cjs
          node --check tests/end_of_shoe.cjs
          node --check tests/full_split_oracle.cjs
          node --check tests/bounded_split_cache.cjs
          node --check tests/shared_dealer_cache.cjs
          node --check omega_worker.js
      - name: Mathematical regression
        run: node tests/v34.cjs
      - name: Independent depleted-shoe oracle
        run: node tests/depleted_oracle.cjs
      - name: PWA integrity
        run: |
          node tests/integrity.cjs
          node tests/pwa_offline.cjs
      - name: Worker lifecycle and performance smoke
        run: |
          node tests/worker_watchdog.cjs
          node tests/performance.cjs
          node tests/offline_actions.cjs
          node tests/end_of_shoe.cjs
          node tests/full_split_oracle.cjs
          node tests/bounded_split_cache.cjs
          node tests/shared_dealer_cache.cjs
