name: Publish Omega II educational PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tests
        run: |
          node --check omega_v34_core.js
          node tests/v34.cjs
          node tests/depleted_oracle.cjs
          node tests/integrity.cjs
          node tests/pwa_offline.cjs
          node tests/worker_watchdog.cjs
          node tests/performance.cjs
          node tests/offline_actions.cjs
          node tests/end_of_shoe.cjs
          node tests/full_split_oracle.cjs
      - name: Stage static-only PWA
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js omega_worker.js omega_v34_core.js _site/
          cp icons/icon.svg _site/icons/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
